<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سوق العرب - متابعة الأسواق الحية</title>
    <!-- Favicon -->
    <link rel="icon" href="https://img.icons8.com/color/48/bitcoin--v1.png">
    <style>
        /* (نفس تنسيقاتك السابقة، تمت إضافة تنسيق جديد للودجت) */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
        body { background: #0b0e11; color: #eaecef; direction: rtl; overflow-x: hidden; }
        :root { --bg-card: #181a20; --gold: #f0b90b; --up-color: #0ecb81; --border-color: #24272c; }
        
        .header-wrapper { padding: 12px 16px 8px 16px; background: linear-gradient(180deg, #1a1d24 0%, #0b0e11 100%); border-bottom: 1px solid var(--border-color); }
        .brand { display: flex; justify-content: space-between; align-items: center; }
        .brand-title { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 700; }
        
        .navigation-tabs { display: flex; gap: 8px; margin-top: 14px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; flex-wrap: wrap; }
        .tab-btn { background: transparent; border: none; color: #848e9c; font-size: 14px; padding: 6px 14px; cursor: pointer; border-radius: 6px; transition: 0.2s; }
        .tab-btn.active { color: var(--gold); background: rgba(240, 185, 11, 0.08); }
        
        .content-section { padding: 12px 14px 20px; display: none; }
        .content-section.active { display: block; }
        .widget-container { width: 100%; height: 350px; border-radius: 12px; overflow: hidden; margin-top: 10px; }
        
        .footer-note { font-size: 12px; color: #848e9c; text-align: center; padding: 20px; border-top: 1px solid var(--border-color); margin-top: 20px; }
        .footer-link { color: var(--gold); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<!-- شريط التيكر العلوي -->
<div class="ticker-tape">
    <div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
    { "symbols": [{"proName":"BINANCE:BTCUSDT"},{"proName":"BINANCE:ETHUSDT"},{"proName":"BINANCE:SOLUSDT"},{"proName":"BINANCE:TONUSDT"}], "colorTheme": "dark", "isTransparent": true, "locale": "ar" }
    </script></div>
</div>

<!-- الهيدر -->
<div class="header-wrapper">
    <div class="brand"><div class="brand-title"><span>📊</span> سوق العرب</div></div>
    <div class="navigation-tabs">
        <button class="tab-btn active" onclick="switchTab('crypto', this)">🪙 عملات رقمية</button>
        <button class="tab-btn" onclick="switchTab('commodities', this)">🛢️ ذهب & نفط</button>
        <button class="tab-btn" onclick="switchTab('news', this)">📰 أخبار حية</button>
    </div>
</div>

<!-- قسم العملات -->
<div id="crypto" class="content-section active">
    <div class="widget-container" style="height: 450px;">
        <div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-screener.js" async>
        { "width": "100%", "height": "100%", "screener_type": "crypto_mkt", "colorTheme": "dark", "locale": "ar", "isTransparent": true }
        </script></div>
    </div>
</div>

<!-- قسم الذهب والنفط -->
<div id="commodities" class="content-section">
    <div class="widget-container" style="height: 450px;">
        <div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-screener.js" async>
        { "width": "100%", "height": "100%", "screener_type": "commodities", "colorTheme": "dark", "locale": "ar", "isTransparent": true }
        </script></div>
    </div>
</div>

<!-- قسم الأخبار الحي (تم التحديث هنا) -->
<div id="news" class="content-section">
    <div class="widget-container" style="height: 500px;">
        <div class="tradingview-widget-container" style="height:100%;width:100%;">
            <div class="tradingview-widget-container__widget" style="height:100%;width:100%;"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
            { "feedMode": "market", "market": "crypto", "colorTheme": "dark", "isTransparent": true, "displayMode": "regular", "width": "100%", "height": "100%", "locale": "ar" }
            </script>
        </div>
    </div>
</div>

<!-- تذييل -->
<div class="footer-note">
    ⚡ جميع البيانات مقدمة من TradingView <br>
    تابعنا على التليجرام: <a href="https://t.me/CryptoNews15bot" class="footer-link">@CryptoNews15bot</a>
</div>

<script>
    function switchTab(tabId, btnElement) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
    }
</script>

</body>
</html>
