<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>منصة تداول - Advanced</title>
    <!-- TradingView Widget -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }
        body {
            background: #0b0e11;
            color: #eaecef;
            direction: rtl;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
            user-select: none;
        }
        :root {
            --bg-main: #0b0e11;
            --bg-card: #181a20;
            --bg-nav: #12161a;
            --text-primary: #eaecef;
            --text-secondary: #848e9c;
            --gold: #f0b90b;
            --up-color: #0ecb81;
            --down-color: #f6465d;
            --border-color: #24272c;
            --nav-height: 68px;
            --header-height: 52px;
        }

        /* الهيكل العام */
        .app-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            background: var(--bg-main);
            position: relative;
            overflow: hidden;
        }

        /* الهيدر العلوي البسيط */
        .app-header {
            height: var(--header-height);
            padding: 8px 16px;
            background: var(--bg-main);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
        }
        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 18px;
            color: var(--gold);
        }
        .app-header .logo span {
            font-size: 22px;
        }
        .app-header .pair-info {
            background: var(--bg-card);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .app-header .pair-info small {
            color: var(--text-secondary);
            font-weight: 400;
            margin-right: 4px;
        }

        /* منطقة الشارت - تأخذ المساحة المتبقية */
        .chart-area {
            flex: 1;
            width: 100%;
            background: var(--bg-main);
            position: relative;
            min-height: 0;
            overflow: hidden;
        }
        .chart-area .tradingview-widget-container {
            height: 100% !important;
            width: 100% !important;
        }
        .chart-area .tradingview-widget-container__widget {
            height: 100% !important;
            width: 100% !important;
        }

        /* شريط التنقل السفلي - ثابت */
        .bottom-nav {
            height: var(--nav-height);
            background: var(--bg-nav);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-shrink: 0;
            padding: 4px 0 10px 0;
            z-index: 20;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            padding: 4px 8px;
            border-radius: 8px;
            min-width: 56px;
            position: relative;
        }
        .nav-item .icon {
            font-size: 24px;
            line-height: 1;
        }
        .nav-item.active {
            color: var(--gold);
        }
        .nav-item.active .icon {
            filter: drop-shadow(0 0 6px rgba(240, 185, 11, 0.25));
        }
        .nav-item .badge-dot {
            position: absolute;
            top: 2px;
            right: 8px;
            width: 8px;
            height: 8px;
            background: var(--down-color);
            border-radius: 50%;
            border: 1px solid var(--bg-nav);
        }

        /* مؤشرات سريعة فوق الشارت */
        .quick-stats {
            position: absolute;
            top: 10px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            background: rgba(11, 14, 17, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.04);
            z-index: 15;
            pointer-events: none;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .quick-stats .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .quick-stats .stat-item .val {
            color: var(--text-primary);
            font-weight: 600;
        }
        .quick-stats .stat-item .change.up { color: var(--up-color); }
        .quick-stats .stat-item .change.down { color: var(--down-color); }

        /* تجاوب */
        @media (max-width: 480px) {
            :root {
                --nav-height: 60px;
                --header-height: 46px;
            }
            .app-header .logo { font-size: 16px; }
            .app-header .pair-info { font-size: 12px; padding: 2px 12px; }
            .nav-item { min-width: 48px; }
            .nav-item .icon { font-size: 22px; }
            .quick-stats { font-size: 10px; padding: 4px 12px; }
        }
        @media (max-width: 380px) {
            .nav-item { min-width: 40px; }
            .nav-item .icon { font-size: 20px; }
            .nav-item span { font-size: 8px; }
        }
        /* إخفاء شريط التمرير */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
<div class="app-wrapper">

    <!-- الهيدر العلوي -->
    <header class="app-header">
        <div class="logo">
            <span>📊</span> سوق العرب
        </div>
        <div class="pair-info">
            BTC/USDT <small>• حي</small>
        </div>
    </header>

    <!-- منطقة الشارت مع إحصائيات سريعة -->
    <div class="chart-area" id="chartContainer">
        <!-- مؤشرات سريعة فوق الشارت -->
        <div class="quick-stats" id="quickStats">
            <div class="stat-item"><span>السعر</span> <span class="val" id="priceVal">67,432</span></div>
            <div class="stat-item"><span>التغيير (24h)</span> <span class="change up" id="changeVal">+2.41%</span></div>
            <div class="stat-item"><span>الحجم</span> <span class="val" id="volumeVal">24.5B</span></div>
        </div>

        <!-- شارت TradingView المتقدم -->
        <div class="tradingview-widget-container" style="height:100%;width:100%;">
            <div class="tradingview-widget-container__widget" style="height:100%;width:100%;"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
            {
              "autosize": true,
              "symbol": "BINANCE:BTCUSDT",
              "interval": "60",
              "timezone": "Etc/UTC",
              "theme": "dark",
              "style": "1",
              "locale": "ar",
              "enable_publishing": false,
              "hide_side_toolbar": false,
              "allow_symbol_change": true,
              "studies": [
                "MASimple@tv-basicstudies",
                "RSI@tv-basicstudies",
                "MACD@tv-basicstudies"
              ],
              "show_popup_button": true,
              "popup_width": "1000",
              "popup_height": "650",
              "hide_top_toolbar": false,
              "hide_legend": false,
              "save_image": false,
              "container_id": "chartContainer"
            }
            </script>
        </div>
    </div>

    <!-- شريط التنقل السفلي (Bottom Navigation) -->
    <nav class="bottom-nav">
        <button class="nav-item" onclick="setActive(this)">
            <span class="icon">📋</span>
            <span>القائمة</span>
        </button>
        <button class="nav-item" onclick="setActive(this)">
            <span class="icon">👥</span>
            <span>مجتمع</span>
        </button>
        <button class="nav-item active" onclick="setActive(this)">
            <span class="icon">🔍</span>
            <span>اكتشف</span>
            <span class="badge-dot"></span>
        </button>
        <button class="nav-item" onclick="setActive(this)">
            <span class="icon">📈</span>
            <span>رسوم بيانية</span>
        </button>
        <button class="nav-item" onclick="setActive(this)">
            <span class="icon">⭐</span>
            <span>قائمة المراقبة</span>
        </button>
    </nav>
</div>

<script>
    // تفعيل العنصر النشط في شريط التنقل
    function setActive(el) {
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        el.classList.add('active');
    }

    // محاكاة تحديث البيانات في المؤشرات السريعة (اختياري)
    window.addEventListener('load', function() {
        // يمكن تحديث القيم بشكل ديناميكي هنا (محاكاة)
        console.log('✅ منصة التداول المتقدمة جاهزة مع شريط سفلي RTL');
    });

    // إعادة ضبط الـ container للتأكد من أن الشارت يملأ المساحة
    setTimeout(() => {
        const container = document.querySelector('.chart-area .tradingview-widget-container');
        if (container) {
            container.style.height = '100%';
            container.style.width = '100%';
        }
    }, 100);
</script>

</body>
</html>
